<style>
:root{--brand:#1E50A2;--brand-d:#123A78;--brand-t:#E8F0FA;--accent:#57B22E;--ink:#14202E;--muted:#5C6B80;--faint:#8A98AC;--bg:#EDF1F6;--surface:#fff;--line:#D8E0EA;--line2:#E9EEF4;--pass:#0E9F6E;--pass-t:#E6F6EF;--fail:#DC2626;--fail-t:#FCECEC;--amber:#C77A00;--amber-t:#FBF0DC;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:linear-gradient(180deg,#EEF3F9,#E4EBF3);background-attachment:fixed;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(150deg,#123A78,#0D1E42)}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(8,20,45,.25);width:100%;max-width:380px;overflow:hidden;border-top:4px solid var(--accent)}
.card-top{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:22px;text-align:center}
.logo{font-family:var(--mono);font-weight:600;letter-spacing:.14em;font-size:13px;border:1.5px solid var(--accent);border-radius:7px;padding:5px 12px;display:inline-block;margin-bottom:10px}
.card-top h1{font-size:18px}.card-top p{font-size:12px;opacity:.8;margin-top:4px}
.card-body{padding:20px;display:grid;gap:12px}
label.f{font-size:12px;font-weight:600;color:var(--muted);display:grid;gap:4px}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:60px}
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px;background:var(--brand);color:#fff}
.btn:disabled{opacity:.5}
.btn.ok{background:var(--pass)}.btn.bad{background:var(--fail)}.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.err{color:var(--fail);font-size:13px;background:var(--fail-t);padding:8px 10px;border-radius:8px}
header{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}header .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .t span{font-size:11px;opacity:.8}
.rchip{background:var(--accent);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;font-family:var(--mono);white-space:nowrap}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:19;overflow-x:auto}
nav button{flex:1 0 auto;padding:11px 12px;border:none;background:none;font-weight:600;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
nav .badge{background:var(--fail);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:3px}
main{max-width:860px;margin:0 auto;padding:12px 12px 80px}
.banner{background:var(--amber-t);border:1px solid #EBCB8B;color:#7A4B00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.banner.blue{background:var(--brand-t);border-color:#B9CFEC;color:var(--brand-d)}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar .inp{flex:1;min-width:140px;padding:9px 11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.subj{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:grid;gap:6px;cursor:pointer}
.subj:active{background:var(--brand-t)}
.subj .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.no{font-family:var(--mono);font-weight:600;font-size:12px;background:var(--brand-t);color:var(--brand);border-radius:6px;padding:2px 7px}
.gb{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#EEF1F5;color:var(--muted)}
.muc{font-weight:600;font-size:14px}
.nd{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.pv{background:var(--pass)}.pr{background:#3B82F6}.po{background:var(--fail)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.st{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;display:inline-block}
.st.open{background:var(--fail-t);color:var(--fail)}.st.reported{background:#E3EEFE;color:#1D4ED8}.st.verified{background:var(--pass-t);color:var(--pass)}.st.none{background:#EEF1F5;color:var(--muted)}.st.na{background:#F1EAFB;color:#6D28D9}
.pt{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#FFF4D6;color:#8A5A00}
.ovl{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px 24px}
@media(min-width:760px){.ovl{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:16px;margin-bottom:4px}
.sheet .x{float:right;background:var(--line2);border:none;border-radius:8px;padding:5px 11px;font-weight:700}
.loc{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;display:grid;gap:6px;background:#FBFCFE}
.loc .z{font-weight:600}
.loc .acts{display:flex;gap:6px;flex-wrap:wrap}
.loc img{max-width:110px;max-height:90px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.note{font-size:12px;color:var(--muted)}.note.r{color:var(--fail)}
.grp{font-size:12px;font-weight:700;color:var(--brand);margin:10px 0 5px}
.zones{display:flex;flex-wrap:wrap;gap:6px}
.zones label{border:1.5px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;display:flex;gap:5px;align-items:center;background:#fff}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}

h3.sec{font-size:14px;margin:14px 0 6px;color:var(--brand-d)}
.pct{display:inline-block;min-width:44px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14202E;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;max-width:90vw}
.toast.e{background:var(--fail)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{display:flex;gap:6px}
.sw label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-weight:600;font-size:13px}

#mapBox{position:relative;width:100%;height:0;padding-top:27.83%;overflow:hidden;background:#e8eef5}
#mapImg{position:absolute;top:-74.65%;left:0;width:100%;height:auto;display:block}
#mapScroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#e8eef5}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:2}
.pin .dot{width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4)}

#pinCanvas{border:1px solid var(--line);border-radius:10px;touch-action:manipulation;max-width:100%}
.lg{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-right:10px}.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.gprog{font-family:var(--mono);font-size:11px;opacity:.85;margin-left:4px}

.grp-sub{font-size:13px;color:var(--muted);margin-bottom:8px}
.grp-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:10px}
.gbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;text-align:center;line-height:1.2}
.gbtn b{display:block;font-size:17px;font-family:var(--mono);color:var(--brand)}
.gbtn span{display:block;font-size:11px;color:var(--muted);margin:1px 0}
.gbtn em{font-style:normal;font-size:11px;font-family:var(--mono);color:var(--faint)}
.gbtn.on{border-color:var(--brand);background:var(--brand-t)}
.gbtn.on b{color:var(--brand-d)}
.gbtn.ok em{color:var(--pass)}
.item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.item.todo{border-left-color:var(--faint)}
.item.has{border-left-color:var(--fail)}
.item.done{border-left-color:var(--pass)}
.item.na{border-left-color:#8B5CF6}
.item .ih{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.item .muc{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.02em;margin-bottom:3px}
.item .nd2{font-size:15.5px;color:var(--ink);font-weight:600;line-height:1.5;background:linear-gradient(90deg,#FFF9E6,#FFFDF5);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:9px 12px;margin:4px 0 7px}
</style>

const DATA={"GROUPS":{"A":{"n":"PCCC","t":"EHS"},"B":{"n":"Thiết bị","t":"EHS"},"C":{"n":"Hóa chất","t":"EHS"},"D":{"n":"An toàn điện","t":"EHS"},"E":{"n":"An toàn chung","t":"EHS"},"F":{"n":"Khu vực sản xuất","t":"PRO.3M"},"G":{"n":"Khu vực phụ trợ","t":"PRO.3M"}},"ITEMS":[{"sid":"M01","no":1,"g":"A","muc":"Bình chữa cháy","nd":"Bình chữa cháy bố trí đúng tiêu chuẩn (15–20 m/vị trí), chất chữa cháy phù hợp, không bị che chắn, không lấn layout, 5S sạch sẽ.","bp":"EHS"},{"sid":"M02","no":2,"g":"A","muc":"Họng chữa cháy","nd":"Niêm yết biển báo họng, HDSD, layout đạt yêu cầu; đồng hồ áp suất có vạch chỉ áp rõ ràng, chính xác.","bp":"EHS"},{"sid":"M03","no":3,"g":"A","muc":"Họng chữa cháy","nd":"Layout không bị che chắn/lấn chiếm, cửa họng mở dễ dàng; check list và 5S họng chữa cháy 1 lần/tháng (trước ngày 05).","bp":"EHS"},{"sid":"M04","no":4,"g":"A","muc":"Đèn chỉ dẫn thoát nạn, exit nền","nd":"Đèn Exit luôn sáng; khoảng cách 2 đèn chỉ hướng ≤ 30 m; hướng chỉ đúng, không dẫn vào khu máy móc, đường cụt.","bp":"EHS"},{"sid":"M05","no":5,"g":"A","muc":"Đèn chỉ dẫn thoát nạn, exit nền","nd":"Exit nền chỉ đúng hướng; đèn exit < 30 m, tem exit nền < 10 m trong xưởng và < 20 m ngoài hành lang; không bong rách, bạc màu.","bp":"EHS"},{"sid":"M06","no":6,"g":"A","muc":"An toàn thoát nạn","nd":"Lối thoát chính ≥ 1,2 m, lối đơn ≥ 0,7 m, không vật cản; cửa thoát hiểm có biển chỉ dẫn, không bị chốt/chặn/khóa/kẹt.","bp":"Sản xuất, EHS"},{"sid":"M07","no":7,"g":"A","muc":"An toàn thoát nạn","nd":"Đèn chiếu sáng khẩn cấp (đèn con cóc): mỗi vị trí ít nhất 1 bóng luôn sáng.","bp":"EHS"},{"sid":"M08","no":8,"g":"A","muc":"An toàn thoát nạn","nd":"Niêm yết sơ đồ thoát nạn khẩn cấp đúng vị trí, đúng hướng, đúng tiêu chuẩn Pro3M.","bp":"EHS"},{"sid":"M09","no":9,"g":"B","muc":"Cơ cấu an toàn","nd":"Nút dừng khẩn cấp đầu nấm đỏ trên nền cover vàng, dừng khi ấn và gỡ khi xoay, gần người thao tác (< 1 m), không bị che khuất.","bp":"Thiết bị, EHS"},{"sid":"M10","no":10,"g":"B","muc":"Cơ cấu an toàn","nd":"Vùng nguy hiểm tiếp cận được (điện cao áp, hóa chất, nhiệt cao, kẹt tay: trục lăn, xích, quạt, piston) có cover/sensor/interlock phòng hộ.","bp":"Thiết bị, EHS"},{"sid":"M11","no":11,"g":"B","muc":"Cơ cấu an toàn","nd":"Cover/sensor/interlock lắp cố định, chỉ tháo bằng dụng cụ chuyên dụng; vùng nguy hiểm (robot, xích) có khóa liên động, chỉ chạy khi cover/cửa đóng kín.","bp":"Thiết bị, EHS"},{"sid":"M12","no":12,"g":"B","muc":"Tia có hại","nd":"Khu vực tia có hại (X, laser, hồng ngoại, UV) có cover phòng hộ phù hợp.","bp":"Thiết bị, EHS"},{"sid":"M13","no":13,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Đèn 3 màu phân biệt rõ trạng thái thiết bị, không trùng màu khó phân biệt, lắp vị trí cao, nhìn thấy từ 4 phía.","bp":"Thiết bị, EHS"},{"sid":"M14","no":14,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Khi có tín hiệu bất thường: chuông cảnh báo kêu, đèn 3 màu hoạt động; âm cảnh báo đạt 80 dB.","bp":"Thiết bị, EHS"},{"sid":"M15","no":15,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Dán tem, nhãn cảnh báo tại khu vực nguy hiểm (nhiệt cao, kẹp, hóa chất, điện); tem nhãn, nút thao tác có tiếng Việt.","bp":"Thiết bị, EHS"},{"sid":"M16","no":16,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Có SOP vận hành thiết bị, hướng dẫn ATMT, quy trình vệ sinh/bảo dưỡng, check list kiểm tra thiết bị hàng ngày.","bp":"Thiết bị"},{"sid":"M17","no":17,"g":"C","muc":"Nhãn, cảnh báo, MSDS","nd":"Khu vực lưu trữ/sử dụng hóa chất niêm yết MSDS đủ 16 nội dung, chuẩn GHS, có dấu xác nhận của Health P.","bp":"Sản xuất, EHS"},{"sid":"M18","no":18,"g":"C","muc":"Nhãn, cảnh báo, MSDS","nd":"Hóa chất có tem nhãn, cảnh báo, hình đồ đầy đủ (đúng kích thước, vị trí); biển cấm lửa; không rách, bẩn.","bp":"Sản xuất, EHS"},{"sid":"M19","no":19,"g":"C","muc":"PPE, PTBVCN","nd":"Nhân viên tiếp xúc hóa chất được trang bị đầy đủ PTBVCN theo tiêu chuẩn EHS.","bp":"Sản xuất, EHS"},{"sid":"M20","no":20,"g":"C","muc":"Môi trường làm việc với hóa chất","nd":"Khu san chiết/sử dụng có ống hút mùi cục bộ (TVOCs > 0,5 ppm), thông gió hoạt động; xe chở hóa chất, rack được tiếp địa.","bp":"EHS"},{"sid":"M21","no":21,"g":"C","muc":"Môi trường làm việc với hóa chất","nd":"Có biện pháp chống tràn đổ hóa chất khi san chiết và sử dụng.","bp":"Sản xuất, EHS"},{"sid":"M22","no":22,"g":"C","muc":"Môi trường làm việc với hóa chất","nd":"Có thùng thu gom rác thải nguy hại tại khu vực sử dụng hóa chất.","bp":"Sản xuất"},{"sid":"M23","no":23,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Chống rò rỉ tại khu lưu trữ: khay chống tràn dung tích ≥ 110% can lớn nhất, giấy thấm.","bp":"Sản xuất"},{"sid":"M24","no":24,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Đủ thiết bị ứng phó khẩn cấp (bình/họng PCCC, khu xử lý sự cố hóa chất, bình rửa mắt, phòng tắm khẩn cấp).","bp":"EHS"},{"sid":"M25","no":25,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Bảo quản đúng từng loại hóa chất (không để chung chất dễ cháy; tránh ánh sáng trực tiếp; dạng bột để nơi khô thoáng).","bp":"EHS"},{"sid":"M26","no":26,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Khu hóa chất sạch, xếp ≤ 2 tầng, đậy nắp, đặt trên pallet, quấn vinyl; không xếp lẫn loại hóa chất trên cùng 1 pallet.","bp":"Kho, EHS"},{"sid":"M27","no":27,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Rác thải hóa chất nguy hại phân loại riêng; vỏ bình sau khi dùng đưa ra kho rác nguy hại.","bp":"Sản xuất"},{"sid":"M28","no":28,"g":"C","muc":"Quản lý rác thải nguy hại","nd":"Có quy trình xử lý rác thải; phân biệt rác nguy hại để có phương pháp xử lý phù hợp.","bp":"EHS"},{"sid":"M29","no":29,"g":"D","muc":"Quản lý ổ cắm điện","nd":"Ổ cắm cố định đạt chuẩn (lỗ chìm/tròn, có tiếp địa, Idm > 15A), che ổ không dùng, nhiệt độ < 60°C, thay ổ có nguy cơ cháy nổ, chảy, vỡ.","bp":"Thiết bị, EHS"},{"sid":"M30","no":30,"g":"D","muc":"Dây điện, kết nối","nd":"Không nối dây dị hình, không vắt ngang lối đi; dây không gãy, gập, hở lõi; không có vật nặng đè.","bp":"Thiết bị, EHS"},{"sid":"M31","no":31,"g":"D","muc":"Dây điện, kết nối","nd":"Đường điện lộ thiên trên sàn có cover bảo vệ.","bp":"EHS"},{"sid":"M32","no":32,"g":"D","muc":"Thiết bị điện","nd":"Có cover an toàn ngăn tiếp xúc phần mang điện.","bp":"Thiết bị, EHS"},{"sid":"M33","no":33,"g":"D","muc":"Thiết bị điện","nd":"Có biển tên, sơ đồ mạch điện, quy định an toàn, biển cảnh báo.","bp":"EHS"},{"sid":"M34","no":34,"g":"D","muc":"Thiết bị điện","nd":"Vỏ, cánh cửa kim loại thiết bị/tủ điện nối dây tiếp địa; tủ điện ngoài xưởng bịt kín chống nước mưa, côn trùng.","bp":"EHS"},{"sid":"M35","no":35,"g":"D","muc":"Thiết bị điện","nd":"Bóp đầu cose và màu áo cose theo thứ tự từng pha đúng tiêu chuẩn.","bp":"EHS"},{"sid":"M36","no":36,"g":"D","muc":"Thiết bị điện","nd":"Phần hở của tủ điện bịt kín bằng vật liệu chịu nhiệt hoặc chống cháy.","bp":"EHS"},{"sid":"M37","no":37,"g":"D","muc":"PPE, PTBVCN","nd":"Nhân viên vận hành, sửa chữa thiết bị điện được trang bị đầy đủ PTBVCN.","bp":"EHS"},{"sid":"M38","no":38,"g":"E","muc":"Sơ cấp cứu","nd":"Xưởng có tủ thuốc sơ cấp cứu đủ vật tư, dễ tiếp cận, tình trạng tốt (1 tủ loại C / 150 nhân viên).","bp":"Y tế"},{"sid":"M39","no":39,"g":"E","muc":"Sơ cấp cứu","nd":"Có lực lượng sơ cứu, cấp cứu được đào tạo, có mặt sớm khi xảy ra sự cố (1 người / 100 nhân viên).","bp":"Y tế"},{"sid":"M40","no":40,"g":"E","muc":"PPE, PTBVCN","nd":"Cấp phát đúng chủng loại PTBVCN cho từng công đoạn.","bp":"Kho, EHS"},{"sid":"M41","no":41,"g":"E","muc":"PPE, PTBVCN","nd":"Nhân viên tuân thủ PPE theo công việc (mũ, giày khi lái xe nâng; khẩu trang khi hàn/sơn; găng tay khi dùng dao; đồ bảo hộ khi tiếp xúc hóa chất...).","bp":"Kho, EHS"},{"sid":"M42","no":42,"g":"E","muc":"An toàn chung","nd":"Kiểm tra an toàn thiết bị (cơ cấu, nút ấn...) trước khi vận hành.","bp":"Thiết bị"},{"sid":"M43","no":43,"g":"E","muc":"An toàn chung","nd":"Không xếp hàng quá cao, có phương án chống nghiêng đổ; hàng trên rack ≤ 1,6 m, cách trần ≥ 0,6 m.","bp":"Kho"},{"sid":"M44","no":44,"g":"E","muc":"An toàn chung","nd":"Rack, xe transfer an toàn (đúng thiết kế, không cong vênh, có cover bịt đầu sắc nhọn).","bp":"Kho"},{"sid":"M45","no":45,"g":"F","muc":"5S","nd":"Vị trí làm việc vệ sinh bụi, dọn rác thường xuyên; có dụng cụ vệ sinh line tình trạng tốt; có túi/khay/thùng rác trên line.","bp":"Sản xuất"},{"sid":"M46","no":46,"g":"F","muc":"5S","nd":"Mặt bàn, băng tải không vẽ bậy, cáu bẩn, dính keo; cover chống xước không bong rách; đủ vạch pitch time, thả set đúng vạch.","bp":"Sản xuất"},{"sid":"M47","no":47,"g":"F","muc":"5S","nd":"Quản lý vệ sinh line: line off tắt điện, khí, thu vật liệu/dụng cụ/jig về kho; line on có chổi 5S, túi/thùng rác, vị trí sạch sẽ.","bp":"Sản xuất"},{"sid":"M48","no":48,"g":"F","muc":"5S","nd":"Túi/box checksheet, WI, thẻ hướng dẫn tình trạng tốt, treo ngay ngắn, đồng bộ; WI, tài liệu được cập nhật mới.","bp":"Sản xuất, QC"},{"sid":"M49","no":49,"g":"F","muc":"5S","nd":"Thiết bị trong ngoài (khoang máy, gầm, cover, nóc máy) vệ sinh thường xuyên; không rò rỉ dầu/nước; filter lọc bụi vệ sinh đúng chu kỳ.","bp":"Thiết bị"},{"sid":"M50","no":50,"g":"F","muc":"5S","nd":"Băng tải, sensor hoạt động tốt, không dồn hàng; hộp điều khiển, cơ cấu truyền động cố định có cover; không rơi mạt bụi.","bp":"Thiết bị, EHS"},{"sid":"M51","no":51,"g":"F","muc":"Đúng vị trí","nd":"Tiêu chuẩn hóa hiện trường đồng bộ: layout, bảng biển, tem nhãn, vị trí thùng rác/ghế/tool, thiết bị thẳng hàng.","bp":"EHS"},{"sid":"M52","no":52,"g":"F","muc":"Đúng vị trí","nd":"Layout vật tư/thiết bị/hàng hóa dán tape hoặc tem góc (lối đi tape xanh lá 10 cm; rack tape xanh dương 5 cm); không bong rách.","bp":"Tất cả bộ phận"},{"sid":"M53","no":53,"g":"F","muc":"Đúng vị trí","nd":"Vật liệu trên bàn thao tác để đúng khu vực; không chồng tray/box quá 40 cm hoặc chênh vênh; không để vật dụng khác đè lên vật liệu.","bp":"Sản xuất, QC"},{"sid":"M54","no":54,"g":"F","muc":"Đúng vị trí","nd":"Không để vật liệu trực tiếp xuống nền xưởng; tray/box để trên giá/bàn đúng chiều, sạch, không nứt vỡ.","bp":"Sản xuất"},{"sid":"M55","no":55,"g":"F","muc":"Đúng vị trí"," function unionBox(a){const x0=Math.min(...a.map(b=>b.x)),y0=Math.min(...a.map(b=>b.y));return{x:x0,y:y0,w:Math.max(...a.map(b=>b.x+b.w))-x0,h:Math.max(...a.map(b=>b.y+b.h))-y0};}
function resolveZone(line){if(!line)return null;const lb=ZONES_CFG.lineBlock,m=line.match(/Line\s*(\d+)/i);if(m&&lb){const n=+m[1];if(n>=1&&n<=lb.count){const cw=lb.w/lb.count;return{x:lb.x+(n-1)*cw,y:lb.y,w:cw,h:lb.h};}}const arr=ZONES_CFG.peripheral[line];return arr&&arr.length?unionBox(arr):null;}
function zoneCenter(line){const z=resolveZone(line);return z?{x:Math.round((z.x+z.w/2)*100)/100,y:Math.round((z.y+z.h/2)*100)/100}:null;}
function expandCrop(z){const px=Math.max(z.w*0.25,2.5),py=Math.max(z.h*0.1,2.5),x=Math.max(0,z.x-px),y=Math.max(0,z.y-py);return{x:x,y:y,w:Math.min(100-x,z.w+2*px),h:Math.min(100-y,z.h+2*py)};}

      if(fn==="vt_add_pin"){NEED(m,true);if((a.p_items||[]).some(it=>!it.photo))throw new Error("Bắt buộc có ảnh cho mỗi vị trí NG");let pid=a.p_pin,zone=a.p_zone,x=a.p_x,y=a.p_y;if(pid){const e=db.locs.find(l=>l.pin_id===pid);if(!e)throw new Error("Không tìm thấy ghim");zone=e.zone;x=e.x;y=e.y;}else pid="P"+(++n);let c=0;a.p_items.forEach(it=>{if(db.locs.some(l=>l.pin_id===pid&&l.sid===it.sid))return;mk(it.sid,zone,it.detail||"",it.owner_part||"","open",{pin_id:pid,x:x,y:y,created_round:db.round,created_by:m.name,created_at:new Date().toISOString(),init_photo:it.photo||null});db.na=db.na.filter(z=>z!==it.sid);c++;});return{data:{pin:pid,n:c}};}

      if(fn==="vt_report_ok"){NEED(m,false);const l=find(a.p_loc);if(!l||l.status!=="open")throw new Error("Điểm này không ở trạng thái chờ khắc phục");if(!m.ehs&&l.owner_part!==m.part)throw new Error("Điểm này thuộc bộ phận "+(l.owner_part||"(chưa gán)")+", bạn không có quyền");if(!m.ehs&&!a.p_photo)throw new Error("Cần ảnh sau khi khắc phục");Object.assign(l,{status:m.ehs?"verified":"reported",reported_by:m.name,reported_part:m.part,reported_at:new Date().toISOString(),reported_round:db.round,report_photo:a.p_photo||null,report_note:a.p_note||null,reject_note:null});if(m.ehs)Object.assign(l,{verified_by:m.name,verified_at:l.reported_at});ev(l,"report_ok",m);if(m.ehs)ev(l,"verify",m);return{data:null};}
      if(fn==="vt_verify"){NEED(m,true);const l=find(a.p_loc);if(!l||l.status!=="reported")throw new Error("Vị trí này không ở trạng thái chờ duyệt");if(a.p_ok){Object.assign(l,{status:"verified",verified_by:m.name,verified_at:new Date().toISOString(),reject_note:null});ev(l,"verify",m);}else{if(!a.p_note)throw new Error("Cần ghi lý do từ chối");reset(l);l.status="open";l.reject_note=a.p_note;ev(l,"reject",m,a.p_note);}return{data:null};}
      if(fn==="vt_reopen"){NEED(m,true);const l=find(a.p_loc);reset(l);l.status="open";l.reject_note=a.p_note;ev(l,"reopen",m,a.p_note);return{data:null};}
      if(fn==="vt_edit_location"){NEED(m,true);const l=find(a.p_loc);Object.assign(l,{zone:a.p_zone,detail:a.p_detail||"",owner_part:a.p_owner||""});return{data:null};}
      if(fn==="vt_remove_location"){NEED(m,true);const i=db.locs.findIndex(x=>x.id===a.p_loc);if(i>=0)db.locs.splice(i,1);return{data:null};}
      if(fn==="vt_set_na"){NEED(m,true);db.na=db.na.filter(x=>x!==a.p_sid);if(a.p_na)db.na.push(a.p_sid);return{data:null};}
      if(fn==="vt_set_setting"){NEED(m,true);if(a.p_key==="round")db.round=+a.p_value;else db.req_photo=a.p_value==="1";return{data:null};}
      if(fn==="vt_set_ehs"){NEED(m,true);db.ehs=db.ehs.filter(x=>x!==a.p_name);if(a.p_on)db.ehs.push(a.p_name);return{data:null};}
      if(fn==="vt_daily_check"){NEED(m,false);const l=find(a.p_loc);if(!l||l.status!=="verified")throw new Error("Điểm chưa ở trạng thái duy trì");if(!m.ehs&&l.owner_part!==m.part)throw new Error("Không thuộc bộ phận bạn");if(a.p_result==="ng"&&!a.p_photo)throw new Error("Báo NG bắt buộc có ảnh");const t2=(new Date()).toISOString().slice(0,10);db.daily=db.daily.filter(x=>!(x.loc_id===l.id&&x.day===t2));db.daily.push({loc_id:l.id,sid:l.sid,day:t2,result:a.p_result,by_name:m.name,by_part:m.part,photo:a.p_photo||null});ev(l,"daily_"+a.p_result,m,a.p_note);if(a.p_result==="ng"){reset(l);l.status="open";l.reject_note="Duy trì NG "+t2;}return{data:null};}
      return{data:null};
    }catch(e){return{error:{message:e.message}};}}
  };
}

/* ---------- báo cáo ---------- */
function calc(scope){
  const subs=SUBJ.filter(s=>scope==="all"||(scope==="M"&&s.kind==="M")||(scope==="F"&&s.kind==="F"));
  const set=new Set(subs.map(s=>s.sid));
  const L=S.locs.filter(l=>set.has(l.sid));
  const R={subs,L,t:L.length,o:0,r:0,v:0,surveyed:0,na:0,unsurveyed:[],byPart:{},byGroup:{},bySubj:[],rounds:{}};
  L.forEach(l=>{R[{open:"o",reported:"r",verified:"v"}[l.status]]++;});
  const bump=(m,k,l)=>{const x=m[k]||(m[k]={t:0,o:0,r:0,v:0});x.t++;x[{open:"o",reported:"r",verified:"v"}[l.status]]++;};
  L.forEach(l=>{bump(R.byPart,l.owner_part||"(chưa gán)",l);bump(R.byGroup,BY[l.sid].g,l);});
  subs.forEach(s=>{const st=stat(s.sid);if(st.na)R.na++;else if(st.t)R.surveyed++;else R.unsurveyed.push(s);R.bySubj.push({s,st});});
  S.events.filter(e=>set.has(e.sid)).forEach(e=>{const x=R.rounds[e.round]||(R.rounds[e.round]={create:0,report_ok:0,verify:0,reject:0,reopen:0});if(x[e.action]!=null)x[e.action]++;});
  return R;
}
function renderReport(){
  const R=calc(SCOPE);

/* ảnh */
function photoBox(id,label){return'<div class="prev"><label class="f">'+label+'<input type="file" accept="image/*" capture="environment" data-ph="'+id+'" class="inp"></label><div id="pv_'+id+'"></div></div>';}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("Không xử lý được ảnh")),"image/jpeg",0.72);};im.src=r.result;};r.readAsDataURL(file);});}
function bindPhotos(root){root.querySelectorAll("input[data-ph]").forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const b=await compress(f);PH[i.dataset.ph]=b;const p=root.querySelector("#pv_"+i.dataset.ph);if(p)p.innerHTML='<img src="'+URL.createObjectURL(b)+'" alt="">';}catch(e){toast("Không đọc được ảnh",true);}});}
async function upPhoto(id){const b=PH[id];if(!b)return null;const path="vt/"+Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";const r=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg",upsert:false});if(r.error)throw new Error("Không tải được ảnh: "+r.error.message);return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;}

/* thao tác */
function act(a,id){
  const l=S.locs.find(x=>x.id===id);if(!l)return;
  if(a==="fix")reportDialog(l);
  else if(a==="daily")dailyDialog(l);
  else if(a==="vok")call("vt_verify",{p_loc:id,p_ok:true,p_note:null},"Đã duyệt · chuyển sang duy trì");
  else if(a==="vno")noteDialog("Trả lại điểm","Lý do trả lại (bộ phận sẽ thấy)","vt_verify",{p_loc:id,p_ok:false},"Đã trả lại");
  else if(a==="reopen")noteDialog("Phát hiện lại vấn đề","Lý do mở lại","vt_reopen",{p_loc:id},"Đã mở lại");
  else if(a==="del"){if(confirm("Xóa điểm kiểm soát này?"))call("vt_remove_location",{p_loc:id,p_note:null},"Đã xóa");}
  else if(a==="edit")editDialog(l);
}
function sub(title,body,onOk,okLabel){

  box.querySelector(".x").onclick=close;
  bindPhotos(box);
  box.querySelectorAll(".sw input").forEach(i=>i.onchange=()=>box.querySelectorAll(".sw label").forEach(l=>l.classList.toggle("on",l.querySelector("input").checked)));
  box.querySelector("#subOk").onclick=async()=>{const b=box.querySelector("#subOk");b.disabled=true;const old=b.textContent;b.textContent="Đang lưu…";try{const ok=await onOk(box);if(ok!==false)close();}catch(e){const er=box.querySelector("#subErr");er.textContent=e.message;er.classList.remove("hidden");}finally{b.disabled=false;b.textContent=old;}};

function dailyDialog(l){
  sub("📋 Kiểm tra duy trì hôm nay — "+esc(l.zone),'<div class="note" style="margin-bottom:6px">'+esc(BY[l.sid].title)+(l.detail?" · "+esc(l.detail):"")+'</div>'
   +'<div class="f">Kết quả hôm nay</div><div class="sw" style="margin-bottom:4px"><label class="on"><input type="radio" name="dr" value="ok" checked>OK (đạt)</label><label><input type="radio" name="dr" value="ng">NG (không đạt)</label></div>'
   +photoBox("dp","📷 Ảnh — BẮT BUỘC khi NG, chụp từ điện thoại")
   +'<label class="f" style="margin-top:8px">Ghi chú<textarea class="inp" id="dn"></textarea></label>',async box=>{
    const res=box.querySelector("input[name=dr]:checked").value;
    if(res==="ng"&&!PH.dp)throw new Error("Báo NG bắt buộc có ảnh chụp từ điện thoại");
    let url=null;if(PH.dp)url=await upPhoto("dp");
    await direct("vt_daily_check",{p_loc:l.id,p_result:res,p_photo:url,p_note:box.querySelector("#dn").value.trim()||null},res==="ok"?"Đã ghi nhận duy trì OK":"Đã ghi NG — chuyển lại chờ khắc phục");PH={};},"Lưu kết quả");
}
/* ---------- bản đồ (tự lấp cờ theo khu vực) ---------- */
function rowOk(l){const s=BY[l.sid];if(!s)return false;if(MF.g==="F"){if(s.kind!=="F")return false;}else if(MF.g&&(s.kind!=="M"||s.g!==MF.g))return false;if(MF.part&&l.owner_part!==MF.part)return false;if(MF.st&&l.status!==MF.st)return false;return true;}
const MCOL={open:"var(--fail)",reported:"#C77A00",verified:"var(--pass)"};
function markerPts(points){
  const byZone={};points.forEach(l=>{const z=resolveZone(l.zone);if(!z)return;(byZone[l.zone]||(byZone[l.zone]={z,arr:[]})).arr.push(l);});
  const out=[];
  Object.keys(byZone).forEach(k=>{const z=byZone[k].z,arr=byZone[k].arr,n=arr.length;
    let cols=Math.max(1,Math.round(Math.sqrt(n*(z.w/Math.max(z.h,0.1)))));cols=Math.max(1,Math.min(6,cols));
    const rows=Math.ceil(n/cols),px=z.w*0.1,py=z.h*0.06,iw=(z.w-2*px)/cols,ih=(z.h-2*py)/rows;
    arr.forEach((l,i)=>{const c=i%cols,r=Math.floor(i/cols);out.push({l,x:z.x+px+iw*(c+0.5),y:z.y+py+ih*(r+0.5)});});});
  return out;
}
function mapFilters(){
  let h='<div class="chips"><button class="chip'+(!MF.g?" on":"")+'" data-mg="">Tất cả</button>'+Object.keys(GROUPS).map(g=>'<button class="chip'+(MF.g===g?" on":"")+'" data-mg="'+g+'">'+g+" · "+GROUPS[g].n+"</button>").join("")+'<button class="chip'+(MF.g==="F"?" on":"")+'" data-mg="F">Lỗi cũ</button></div>';
  h+='<div class="bar"><select class="inp" id="mp" style="max-width:140px"><option value="">Mọi bộ phận</option>'+PARTS.map(p=>"<option"+(MF.part===p?" selected":"")+">"+p+"</option>").join("")+'</select><select class="inp" id="ms" style="max-width:180px">'+[["","Mọi trạng thái"],["open","Chờ khắc phục"],["reported","Chờ duyệt"],["verified","Đang duy trì"]].map(o=>'<option value="'+o[0]+'"'+(MF.st===o[0]?" selected":"")+">"+o[1]+"</option>").join("")+'</select><button class="btn ghost sm" id="mz">🔍 '+(MAPZ>1?"Thu nhỏ":"Phóng to")+"</button></div>";
  return h;
}
function renderMap(){
  const pts=S.locs.filter(rowOk),M=markerPts(pts),noMap=pts.length-M.length;
  const cnt={open:0,reported:0,verified:0};pts.forEach(l=>cnt[l.status]++);
  let h=mapFilters();
  h+='<div id="mapScroll"><div id="mapBox" style="width:'+(MAPZ*100)+'%"><img id="mapImg" src="'+LAYOUT_SRC+'" alt="layout" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=LAYOUT_FB}">'
   +M.map(o=>'<div class="pin" data-pt="'+o.l.id+'" style="left:'+(Math.round(o.x*100)/100)+"%;top:"+(Math.round(yPct(o.y)*100)/100)+'%"><div class="dot" style="background:'+MCOL[o.l.status]+'"></div></div>').join("")+'</div></div>';
  h+='<div class="meta" style="margin:8px 0"><span class="lg"><i style="background:var(--fail)"></i>Chờ khắc phục '+cnt.open+'</span><span class="lg"><i style="background:#C77A00"></i>Chờ duyệt '+cnt.reported+'</span><span class="lg"><i style="background:var(--pass)"></i>Đang duy trì '+cnt.verified+'</span><span>'+pts.length+' điểm</span>'+(noMap>0?'<span>'+noMap+' điểm ngoài sơ đồ</span>':"")+'</div>';
  if(!pts.length)h+='<div class="note">Chưa có điểm kiểm soát nào'+(MF.g||MF.part||MF.st?" với bộ lọc này":"")+'.</div>';
  return h;
}
function openPoint(id,keep){
  const l=S.locs.find(x=>x.id===id);if(!l){closeModal();return;}
  CURPIN=id;const sh=$("modal").querySelector(".sheet"),sc=sh?sh.scrollTop:0;
  openModal('<button class="x">Đóng</button>'+locCard(l,true));bindActs($("modal"));
  if(keep){const n=$("modal").querySelector(".sheet");if(n)n.scrollTop=sc;}
}
/* ---------- theo bộ phận ---------- */
function deptSection(part,L){
  if(!L.length)return'';
  const ord={open:0,reported:1,verified:2};L=L.slice().sort((a,b)=>ord[a.status]-ord[b.status]);
  const o=L.filter(l=>l.status==="open").length,r=L.filter(l=>l.status==="reported").length,v=L.filter(l=>l.status==="verified").length;
  return'<h3 class="sec">'+esc(part)+' — '+L.length+' điểm · <span style="color:var(--fail)">'+o+' chờ khắc phục</span> · <span style="color:#C77A00">'+r+' chờ duyệt</span> · <span style="color:var(--pass)">'+v+' duy trì</span></h3>'+L.map(l=>locCard(l,true)).join("");
}
function renderDept(){
  let h=roundBanner();
  if(isEHS()){
    const rep=S.locs.filter(l=>l.status==="reported");
    if(rep.length)h+='<div class="banner"><b>Chờ bạn duyệt: '+rep.length+' điểm.</b></div>'+rep.map(l=>locCard(l,true)).join("");
    PARTS.forEach(p=>{h+=deptSection(p,S.locs.filter(l=>l.owner_part===p));});
    const none=S.locs.filter(l=>!l.owner_part);if(none.length)h+=deptSection("(chưa gán bộ phận)",none);
    if(!S.locs.length)h+='<div class="note">Chưa có điểm kiểm soát nào. Vào tab "Lập danh mục" để thêm.</div>';
  }else{
    const mine=S.me?S.me.part:"";const L=S.locs.filter(l=>l.owner_part===mine);
    h+='<div class="note" style="margin-bottom:8px">Bộ phận '+esc(mine||"—")+' · '+L.length+' điểm được giao. Khắc phục kèm ảnh; điểm đang duy trì thì kiểm tra OK/NG mỗi ngày.</div>';
    h+=L.length?deptSection(mine,L):'<div class="note">Chưa có điểm nào được giao cho bộ phận bạn.</div>';
  }
  return h;
}
$("lgBtn").onclick=doLogin;
$("lgPin").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
boot();
</script>
