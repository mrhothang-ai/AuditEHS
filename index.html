<style>

 toàn","nd":"Vùng nguy hiểm tiếp cận được (điện cao áp, hóa chất, nhiệt cao, kẹt tay: trục lăn, xích, quạt, piston) có cover/sensor/interlock phòng hộ.","bp":"Thiết bị, EHS"},{"sid":"M11","no":11,"g":"B","muc":"Cơ cấu an toàn","nd":"Cover/sensor/interlock lắp cố định, chỉ tháo bằng dụng cụ chuyên dụng; vùng nguy hiểm (robot, xích) có khóa liên động, chỉ chạy khi cover/cửa đóng kín.","bp":"Thiết bị, EHS"},{"sid":"M12","no":12,"g":"B","muc":"Tia có hại","nd":"Khu vực tia có hại (X, laser, hồng ngoại, UV) có cover phòng hộ phù hợp.","bp":"Thiết bị, EHS"},{"sid":"M13","no":13,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Đèn 3 màu phân biệt rõ trạng thái thiết bị, không trùng màu khó phân biệt, lắp vị trí cao, nhìn thấy từ 4 phía.","bp":"Thiết bị, EHS"},{"sid":"M14","no":14,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Khi có tín hiệu bất thường: chuông cảnh báo kêu, đèn 3 màu hoạt động; âm cảnh báo đạt 80 dB.","bp":"Thiết bị, EHS"},{"sid":"M15","no":15,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Dán tem, nhãn cảnh báo tại khu vực nguy hiểm (nhiệt cao, kẹp, hóa chất, điện); tem nhãn, nút thao tác có tiếng Việt.","bp":"Thiết bị, EHS"},{"sid":"M16","no":16,"g":"B","muc":"Hướng dẫn, cảnh báo","nd":"Có SOP vận hành thiết bị, hướng dẫn ATMT, quy trình vệ sinh/bảo dưỡng, check list kiểm tra thiết bị hàng ngày.","bp":"Thiết bị"},{"sid":"M17","no":17,"g":"C","muc":"Nhãn, cảnh báo, MSDS","nd":"Khu vực lưu trữ/sử dụng hóa chất niêm yết MSDS đủ 16 nội dung, chuẩn GHS, có dấu xác nhận của Health P.","bp":"Sản xuất, EHS"},{"sid":"M18","no":18,"g":"C","muc":"Nhãn, cảnh báo, MSDS","nd":"Hóa chất có tem nhãn, cảnh báo, hình đồ đầy đủ (đúng kích thước, vị trí); biển cấm lửa; không rách, bẩn.","bp":"Sản xuất, EHS"},{"sid":"M19","no":19,"g":"C","muc":"PPE, PTBVCN","nd":"Nhân viên tiếp xúc hóa chất được trang bị đầy đủ PTBVCN theo tiêu chuẩn EHS.","bp":"Sản xuất, EHS"},{"sid":"M20","no":20,"g":"C","muc":"Môi trường làm việc với hóa chất","nd":"Khu san chiết/sử dụng có ống hút mùi cục bộ (TVOCs > 0,5 ppm), thông gió hoạt động; xe chở hóa chất, rack được tiếp địa.","bp":"EHS"},{"sid":"M21","no":21,"g":"C","muc":"Môi trường làm việc với hóa chất","nd":"Có biện pháp chống tràn đổ hóa chất khi san chiết và sử dụng.","bp":"Sản xuất, EHS"},{"sid":"M22","no":22,"g":"C","muc":"Môi trường làm việc với hóa chất","nd":"Có thùng thu gom rác thải nguy hại tại khu vực sử dụng hóa chất.","bp":"Sản xuất"},{"sid":"M23","no":23,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Chống rò rỉ tại khu lưu trữ: khay chống tràn dung tích ≥ 110% can lớn nhất, giấy thấm.","bp":"Sản xuất"},{"sid":"M24","no":24,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Đủ thiết bị ứng phó khẩn cấp (bình/họng PCCC, khu xử lý sự cố hóa chất, bình rửa mắt, phòng tắm khẩn cấp).","bp":"EHS"},{"sid":"M25","no":25,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Bảo quản đúng từng loại hóa chất (không để chung chất dễ cháy; tránh ánh sáng trực tiếp; dạng bột để nơi khô thoáng).","bp":"EHS"},{"sid":"M26","no":26,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Khu hóa chất sạch, xếp ≤ 2 tầng, đậy nắp, đặt trên pallet, quấn vinyl; không xếp lẫn loại hóa chất trên cùng 1 pallet.","bp":"Kho, EHS"},{"sid":"M27","no":27,"g":"C","muc":"Lưu trữ, bảo quản hóa chất","nd":"Rác thải hóa chất nguy hại phân loại riêng; vỏ bình sau khi dùng đưa ra kho rác nguy hại.","bp":"Sản xuất"},{"sid":"M28","no":28,"g":"C","muc":"Quản lý rác thải nguy hại","nd":"Có quy trình xử lý rác thải; phân biệt rác nguy hại để có phương pháp xử lý phù hợp.","bp":"EHS"},{"sid":"M29","no":29,"g":"D","muc":"Quản lý ổ cắm điện","nd":"Ổ cắm cố định đạt chuẩn (lỗ chìm/tròn, có tiếp địa, Idm > 15A), che ổ không dùng, nhiệt độ < 60°C, thay ổ có nguy cơ cháy nổ, chảy, vỡ.","bp":"Thiết bị, EHS"},{"sid":"M30","no":30,"g":"D","muc":"Dây điện, kết nối","nd":"Không nối dây dị hình, không vắt ngang lối đi; dây không gãy, gập, hở lõi; không có vật nặng đè.","bp":"Thiết bị, EHS"},{"sid":"M31","no":31,"g":"D","muc":"Dây điện, kết nối","nd":"Đường điện lộ thiên trên sàn có cover bảo vệ.","bp":"EHS"},{"sid":"M32","no":32,"g":"D","muc":"Thiết bị điện","nd":"Có cover an toàn ngăn tiếp xúc phần mang điện.","bp":"Thiết bị, EHS"},{"sid":"M33","no":33,"g":"D","muc":"Thiết bị điện","nd":"Có biển tên, sơ đồ mạch điện, quy định an toàn, biển cảnh báo.","bp":"EHS"},{"sid":"M34","no":34,"g":"D","muc":"Thiết bị điện","nd":"Vỏ, cánh cửa kim loại thiết bị/tủ điện nối dây tiếp địa; tủ điện ngoài xưởng bịt kín chống nước mưa, côn trùng.","bp":"EHS"},{"sid":"M35","no":35,"g":"D","muc":"Thiết bị điện","nd":"Bóp đầu cose và màu áo cose theo thứ tự từng pha đúng tiêu chuẩn.","bp":"EHS"},{"sid":"M36","no":36,"g":"D","muc":"Thiết bị điện","nd":"Phần hở của tủ điện bịt kín bằng vật liệu chịu nhiệt hoặc chống cháy.","bp":"EHS"},{"sid":"M37","no":37,"g":"D","muc":"PPE, PTBVCN","nd":"Nhân viên vận hành, sửa chữa thiết bị điện được trang bị đầy đủ PTBVCN.","bp":"EHS"},{"sid":"M38","no":38,"g":"E","muc":"Sơ cấp cứu","nd":"Xưởng có tủ thuốc sơ cấp cứu đủ vật tư, dễ tiếp cận, tình trạng tốt (1 tủ loại C / 150 nhân viên).","bp":"Y tế"},{"sid":"M39","no":39,"g":"E","muc":"Sơ cấp cứu","nd":"Có lực lượng sơ cứu, cấp cứu được đào tạo, có mặt sớm khi xảy ra sự cố (1 người / 100 nhân viên).","bp":"Y tế"},{"sid":"M40","no":40,"g":"E","muc":"PPE, PTBVCN","nd":"Cấp phát đúng chủng loại PTBVCN cho từng công đoạn.","bp":"Kho, EHS"},{"sid":"M41","no":41,"g":"E","muc":"PPE, PTBVCN","nd":"Nhân viên tuân thủ PPE theo công việc (mũ, giày khi lái xe nâng; khẩu trang khi hàn/sơn; găng tay khi dùng dao; đồ bảo hộ khi tiếp xúc hóa chất...).","bp":"Kho, EHS"},{"sid":"M42","no":42,"g":"E","muc":"An toàn chung","nd":"Kiểm tra an toàn thiết bị (cơ cấu, nút ấn...) trước khi vận hành.","bp":"Thiết bị"},{"sid":"M43","no":43,"g":"E","muc":"An toàn chung","nd":"Không xếp hàng quá cao, có phương án chống nghiêng đổ; hàng trên rack ≤ 1,6 m, cách trần ≥ 0,6 m.","bp":"Kho"},{"sid":"M44","no":44,"g":"E","muc":"An toàn chung","nd":"Rack, xe transfer an toàn (đúng thiết kế, không cong vênh, có cover bịt đầu sắc nhọn).","bp":"Kho"},{"sid":"M45","no":45,"g":"F","muc":"5S","nd":"Vị trí làm việc vệ sinh bụi, dọn rác thường xuyên; có dụng cụ vệ sinh line tình trạng tốt; có túi/khay/thùng rác trên line.","bp":"Sản xuất"},{"sid":"M46","no":46,"g":"F","muc":"5S","nd":"Mặt bàn, băng tải không vẽ bậy, cáu bẩn, dính keo; cover chống xước không bong rách; đủ vạch pitch time, thả set đúng vạch.","bp":"Sản xuất"},{"sid":"M47","no":47,"g":"F","muc":"5S","nd":"Quản lý vệ sinh line: line off tắt điện, khí, thu vật liệu/dụng cụ/jig về kho; line on có chổi 5S, túi/thùng rác, vị trí sạch sẽ.","bp":"Sản xuất"},{"sid":"M48","no":48,"g":"F","muc":"5S","nd":"Túi/box checksheet, WI, thẻ hướng dẫn tình trạng tốt, treo ngay ngắn, đồng bộ; WI, tài liệu được cập nhật mới.","bp":"Sản xuất, QC"},{"sid":"M49","no":49,"g":"F","muc":"5S","nd":"Thiết bị trong ngoài (khoang máy, gầm, cover, nóc máy) vệ sinh thường xuyên; không rò rỉ dầu/nước; filter lọc bụi vệ sinh đúng chu kỳ.","bp":"Thiết bị"},{"sid":"M50","no":50,"g":"F","muc":"5S","nd":"Băng tải, sensor hoạt động tốt, không dồn hàng; hộp điều khiển, cơ cấu truyền động cố định có cover; không rơi mạt bụi.","bp":"Thiết bị, EHS"},{"sid":"M51","no":51,"g":"F","muc":"Đúng vị trí","nd":"Tiêu chuẩn hóa hiện trường đồng bộ: layout, bảng biển, tem nhãn, vị trí thùng rác/ghế/tool, thiết bị thẳng hàng.","bp":"EHS"},{"sid":"M52","no":52,"g":"F","muc":"Đúng vị trí","nd":"Layout vật tư/thiết bị/hàng hóa dán tape hoặc tem góc (lối đi tape xanh lá 10 cm; rack tape xanh dương 5 cm); không bong rách.","bp":"Tất cả bộ phận"},{"sid":"M53","no":53,"g":"F","muc":"Đúng vị trí","nd":"Vật liệu trên bàn thao tác để đúng khu vực; không chồng tray/box quá 40 cm hoặc chênh vênh; không để vật dụng khác đè lên vật liệu.","bp":"Sản xuất, QC"},{"sid":"M54","no":54,"g":"F","muc":"Đúng vị trí","nd":"Không để vật liệu trực tiếp xuống nền xưởng; tray/box để trên giá/bàn đúng chiều, sạch, không nứt vỡ.","bp":"Sản xuất"},{"sid":"M55","no":55,"g":"F","muc":"Đúng vị trí"," function unionBox(a){const x0=Math.min(...a.map(b=>b.x)),y0=Math.min(...a.map(b=>b.y));return{x:x0,y:y0,w:Math.max(...a.map(b=>b.x+b.w))-x0,h:Math.max(...a.map(b=>b.y+b.h))-y0};}
function resolveZone(line){if(!line)return null;const lb=ZONES_CFG.lineBlock,m=line.match(/Line\s*(\d+)/i);if(m&&lb){const n=+m[1];if(n>=1&&n<=lb.count){const cw=lb.w/lb.count;return{x:lb.x+(n-1)*cw,y:lb.y,w:cw,h:lb.h};}}const arr=ZONES_CFG.peripheral[line];return arr&&arr.length?unionBox(arr):null;}
function zoneCenter(line){const z=resolveZone(line);return z?{x:Math.round((z.x+z.w/2)*100)/100,y:Math.round((z.y+z.h/2)*100)/100}:null;}
function expandCrop(z){const px=Math.max(z.w*0.25,2.5),py=Math.max(z.h*0.1,2.5),x=Math.max(0,z.x-px),y=Math.max(0,z.y-py);return{x:x,y:y,w:Math.min(100-x,z.w+2*px),h:Math.min(100-y,z.h+2*py)};}

const todayStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());};

function allPins(){
  const m={};
  S.locs.forEach(l=>{const s=BY[l.sid];if(!s||!l.pin_id)return;
    const p=m[l.pin_id]||(m[l.pin_id]={id:l.pin_id,zone:l.zone,owner_part:l.owner_part,kind:s.kind,g:s.kind==="F"?"FAIL":s.g,items:[],photo:null,created_by:l.created_by,created_at:l.created_at});

  const a=Object.values(m);
  a.forEach(p=>{p.status=p.items.some(x=>x.status==="open")?"open":p.items.some(x=>x.status==="reported")?"reported":"verified";p.items.sort((x,y)=>(BY[x.sid].no||BY[x.sid].id||0)-(BY[y.sid].no||BY[y.sid].id||0));});

}

/* ---------- báo cáo ---------- */
function calc(scope){
  const subs=SUBJ.filter(s=>scope==="all"||(scope==="M"&&s.kind==="M")||(scope==="F"&&s.kind==="F"));
  const set=new Set(subs.map(s=>s.sid));
  const L=S.locs.filter(l=>set.has(l.sid));
  const pins=allPins().filter(p=>p.items.some(it=>set.has(it.sid)));
  const R={subs,L,pins,it:{t:L.length,o:0,r:0,v:0},pn:{t:pins.length,o:0,r:0,v:0},byPart:{},byGroup:{},missing:[]};
  L.forEach(l=>{R.it[{open:"o",reported:"r",verified:"v"}[l.status]]++;});
  pins.forEach(p=>{R.pn[{open:"o",reported:"r",verified:"v"}[p.status]]++;});
  const bump=(m,k,p)=>{const x=m[k]||(m[k]={t:0,o:0,r:0,v:0,it:0});x.t++;x[{open:"o",reported:"r",verified:"v"}[p.status]]++;x.it+=p.items.length;};
  pins.forEach(p=>{bump(R.byPart,p.owner_part||"(chưa gán)",p);bump(R.byGroup,p.kind==="F"?"FAIL":p.g,p);});
  subs.forEach(s=>{if(!S.locs.some(l=>l.sid===s.sid))R.missing.push(s);});
  return R;
}

  return h;

function photoBox(id,label){return'<div class="prev"><label class="f">'+label+'<input type="file" accept="image/*" capture="environment" data-ph="'+id+'" class="inp"></label><div id="pv_'+id+'"></div></div>';}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("Không xử lý được ảnh")),"image/jpeg",0.72);};im.src=r.result;};r.readAsDataURL(file);});}
function bindPhotos(root){root.querySelectorAll("input[data-ph]").forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const b=await compress(f);PH[i.dataset.ph]=b;const p=root.querySelector("#pv_"+i.dataset.ph);if(p)p.innerHTML='<img src="'+URL.createObjectURL(b)+'" alt="">';}catch(e){toast("Không đọc được ảnh",true);}});}
async function upPhoto(id){const b=PH[id];if(!b)return null;const path="vt/"+Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";const r=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg",upsert:false});if(r.error)throw new Error("Không tải được ảnh: "+r.error.message);return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;}

/* ---------- bản đồ (tự lấp cờ theo khu vực) ---------- */
function pinFilter(p){if(MF.g==="FAIL"){if(p.kind!=="F")return false;}else if(MF.g&&(p.kind!=="M"||p.g!==MF.g))return false;if(MF.part&&p.owner_part!==MF.part)return false;if(MF.st&&p.status!==MF.st)return false;return true;}
const MCOL={open:"var(--fail)",reported:"#C77A00",verified:"var(--pass)"};
function markerPins(pins){
  const byZone={};pins.forEach(p=>{const z=resolveZone(p.zone);if(!z)return;(byZone[p.zone]||(byZone[p.zone]={z,arr:[]})).arr.push(p);});
  const out=[];
  Object.keys(byZone).forEach(k=>{const z=byZone[k].z,arr=byZone[k].arr,n=arr.length;
    let cols=Math.max(1,Math.round(Math.sqrt(n*(z.w/Math.max(z.h,0.1)))));cols=Math.max(1,Math.min(6,cols));
    const rows=Math.ceil(n/cols),px=z.w*0.1,py=z.h*0.06,iw=(z.w-2*px)/cols,ih=(z.h-2*py)/rows;
    arr.forEach((p,i)=>{const c=i%cols,r=Math.floor(i/cols);out.push({p,x:z.x+px+iw*(c+0.5),y:z.y+py+ih*(r+0.5)});});});
  return out;
}
function mapFilters(){
  let h='<div class="chips"><button class="chip'+(!MF.g?" on":"")+'" data-mg="">Tất cả</button>'+Object.keys(GROUPS).map(g=>'<button class="chip'+(MF.g===g?" on":"")+'" data-mg="'+g+'">'+g+" · "+GROUPS[g].n+"</button>").join("")+'<button class="chip'+(MF.g==="FAIL"?" on":"")+'" data-mg="FAIL">Lỗi cũ</button></div>';
  h+='<div class="bar"><select class="inp" id="mp" style="max-width:140px"><option value="">Mọi bộ phận</option>'+PARTS.map(p=>"<option"+(MF.part===p?" selected":"")+">"+p+"</option>").join("")+'</select><select class="inp" id="ms" style="max-width:180px">'+[["","Mọi trạng thái"],["open","Chờ khắc phục"],["reported","Chờ duyệt"],["verified","Đang duy trì"]].map(o=>'<option value="'+o[0]+'"'+(MF.st===o[0]?" selected":"")+">"+o[1]+"</option>").join("")+'</select><button class="btn ghost sm" id="mz">🔍 '+(MAPZ>1?"Thu nhỏ":"Phóng to")+"</button></div>";
  return h;
}
function renderMap(){
  const pins=allPins().filter(pinFilter),M=markerPins(pins),noMap=pins.length-M.length;
  const cnt={open:0,reported:0,verified:0};pins.forEach(p=>cnt[p.status]++);
  let h=mapFilters();
  h+='<div id="mapScroll"><div id="mapBox" style="width:'+(MAPZ*100)+'%"><img id="mapImg" src="'+LAYOUT_SRC+'" alt="layout" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=LAYOUT_FB}">'
   +M.map(o=>'<div class="pin" data-pid="'+o.p.id+'" style="left:'+(Math.round(o.x*100)/100)+"%;top:"+(Math.round(yPct(o.y)*100)/100)+'%"><div class="dot" style="background:'+MCOL[o.p.status]+'"></div>'+(o.p.items.length>1?'<span class="cnt">'+o.p.items.length+"</span>":"")+"</div>").join("")+"</div></div>";
  h+='<div class="meta" style="margin:8px 0"><span class="lg"><i style="background:var(--fail)"></i>Chờ khắc phục '+cnt.open+'</span><span class="lg"><i style="background:#C77A00"></i>Chờ duyệt '+cnt.reported+'</span><span class="lg"><i style="background:var(--pass)"></i>Đang duy trì '+cnt.verified+'</span><span>'+pins.length+' điểm</span>'+(noMap>0?'<span>'+noMap+' điểm ngoài sơ đồ</span>':"")+'</div>';
  if(!pins.length)h+='<div class="note">Chưa có điểm nào'+(MF.g||MF.part||MF.st?" với bộ lọc này":"")+'.</div>';
  return h;
}

function deptSection(part,pins){
  if(!pins.length)return'';
  const ord={open:0,reported:1,verified:2};pins=pins.slice().sort((a,b)=>ord[a.status]-ord[b.status]);
  const o=pins.filter(p=>p.status==="open").length,r=pins.filter(p=>p.status==="reported").length,v=pins.filter(p=>p.status==="verified").length;
  return'<h3 class="sec">'+esc(part)+' — '+pins.length+' điểm · <span style="color:var(--fail)">'+o+' chờ KP</span> · <span style="color:#C77A00">'+r+' chờ duyệt</span> · <span style="color:var(--pass)">'+v+' duy trì</span></h3>'+pins.map(pinCard).join("");
}
function renderDept(){
  let h=roundBanner();const P=allPins();
  if(isEHS()){
    const rep=P.filter(p=>p.status==="reported");
    if(rep.length)h+='<div class="banner"><b>Chờ bạn duyệt: '+rep.length+' điểm.</b></div>'+rep.map(pinCard).join("");
    PARTS.forEach(pt=>{h+=deptSection(pt,P.filter(p=>p.owner_part===pt));});
    const none=P.filter(p=>!p.owner_part);if(none.length)h+=deptSection("(chưa gán bộ phận)",none);
    if(!P.length)h+='<div class="note">Chưa có điểm kiểm soát nào. Vào "Lập danh mục" để thêm.</div>';
  }else{
    const mine=S.me?S.me.part:"";const L=P.filter(p=>p.owner_part===mine);
    h+='<div class="note" style="margin-bottom:8px">Bộ phận '+esc(mine||"—")+' · '+L.length+' điểm được giao.</div>';
    h+=L.length?deptSection(mine,L):'<div class="note">Chưa có điểm nào được giao cho bộ phận bạn.</div>';
  }
  return h;
}

$("lgBtn").onclick=doLogin;
$("lgPin").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
boot();
